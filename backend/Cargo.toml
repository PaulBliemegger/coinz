[package]
name = "coinz"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1.4"
sha2 = "0.10"
rpassword = "7"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate", "macros"], default-features = false }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tower-sessions = "0.15"
tower-sessions-sqlx-store = { version = "=0.15.1", features = ["sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
