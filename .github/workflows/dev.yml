name: Dev checks and images

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: make setup
      - name: Install Chromium and its system dependencies
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: make check
      - name: Keep synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Image (${{ matrix.arch }})
    needs: check
    # Pull requests never receive registry write access or publish images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set the lowercase registry name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native production image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=coinz-${{ matrix.arch }}
          cache-to: type=gha,scope=coinz-${{ matrix.arch }},mode=max
      - name: Smoke-test with a disposable synthetic database
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/ci-image-smoke.sh "$IMAGE:sha-$GITHUB_SHA-$ARCH"
      - name: Push the tested image and record its digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ref="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$ref"
          mkdir -p "$RUNNER_TEMP/digests"
          docker image inspect --format '{{json .RepoDigests}}' "$ref" \
            | jq -er --arg prefix "$IMAGE@" '.[] | select(startswith($prefix))' \
            > "$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set the lowercase registry name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish dev and commit tags from the tested digests
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:dev" \
            "$(cat "$RUNNER_TEMP/digests/amd64.txt")" \
            "$(cat "$RUNNER_TEMP/digests/arm64.txt")"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/image-manifest.txt"
          {
            echo 'Deploy manually using the digest below; dev is a moving tag.'
            echo '```text'
            cat "$RUNNER_TEMP/image-manifest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
